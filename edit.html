{% extends "base.html" %}
{% block title %}— Modifier l'entrée{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2 style="margin-bottom: 1.5rem;">Modifier l'entrée pour {{ entry.site }}</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="site">Nom du site ou service</label>
            <input type="text" name="site" id="site" required value="{{ entry.site }}">
        </div>
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" name="username" id="username" required value="{{ entry.username }}">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" name="password" id="password" required value="{{ plain }}">
                <button type="button" class="btn btn-ghost" onclick="generatePwd()">⚡ Générer</button>
            </div>
        </div>
        <div class="form-group">
            <label for="categorie">Catégorie</label>
            <input type="text" name="categorie" id="categorie" value="{{ entry.categorie }}">
        </div>
        <div class="form-group">
            <label for="note">Note ou commentaire</label>
            <textarea name="note" id="note" rows="3">{{ entry.note }}</textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">Mettre à jour</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Annuler</a>
        </div>
    </form>
</div>

<script>
async function generatePwd() {
    const res = await fetch('/generate');
    const data = await res.json();
    document.getElementById('password').value = data.password;
}
</script>
{% endblock %}
